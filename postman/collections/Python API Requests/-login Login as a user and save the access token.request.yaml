$kind: http-request
name: /login Login as a user and save the access token
description: ""
url: "{{url}}/login"
method: POST
headers:
  Authorization: "Bearer "
body:
  type: json
  content: "{\r

    \    \"username\": \"test\",\r

    \    \"password\": \"test\"\r

    }"
scripts:
  - type: afterResponse
    code: "// Get the JSON response\r

      const response = pm.response.json();\r

      \r

      // Check that login succeeded\r

      if (pm.response.code === 200 && response.access_token) {\r

      \r

      \    // Save JWT to environment variable\r

      \    pm.environment.set(\"access_token\", response.access_token);\r

      \r

      \    console.log(\"Access token saved!\");\r

      \r

      } else {\r

      \    console.log(\"Login failed. Token was not saved.\");\r

      }"
    language: text/javascript
order: 8725
